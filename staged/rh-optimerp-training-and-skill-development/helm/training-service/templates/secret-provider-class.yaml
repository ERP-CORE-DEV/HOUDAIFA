apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "training-service.fullname" . }}-kv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "training-service.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    # -------------------------------------------------------------------------
    # Azure Key Vault reference
    # -------------------------------------------------------------------------
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.secrets.userAssignedIdentityClientId | quote }}
    keyvaultName: {{ .Values.secrets.keyVaultName | quote }}
    tenantId: {{ .Values.secrets.tenantId | quote }}
    cloudName: ""

    # -------------------------------------------------------------------------
    # Secrets to fetch from Key Vault
    # Each object maps a Key Vault secret name to a local filename under
    # the CSI mount path (/mnt/secrets).
    # -------------------------------------------------------------------------
    objects: |
      array:
        - |
          objectName: {{ .Values.secrets.cosmosDbSecretName }}
          objectType: secret
          objectAlias: cosmosdb-connection-string
        - |
          objectName: {{ .Values.secrets.jwtSecretName }}
          objectType: secret
          objectAlias: jwt-settings
        - |
          objectName: {{ .Values.secrets.appInsightsSecretName }}
          objectType: secret
          objectAlias: appinsights-connection-string

  # ---------------------------------------------------------------------------
  # secretObjects: surface Key Vault secrets as native Kubernetes Secrets so
  # they can be referenced via secretKeyRef in the Deployment env section.
  # The Kubernetes Secret is only created/updated while at least one pod with
  # this SecretProviderClass volume is running.
  # ---------------------------------------------------------------------------
  secretObjects:
    - secretName: {{ include "training-service.fullname" . }}-secrets
      type: Opaque
      data:
        - objectName: cosmosdb-connection-string
          key: cosmosdb-connection-string
        - objectName: jwt-settings
          key: jwt-settings
        - objectName: appinsights-connection-string
          key: appinsights-connection-string
